name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet -tags fts5 ./...

      - name: Build
        run: go build -tags fts5 -o cogos ./cmd/cogos

      - name: Build (with MCP)
        run: go build -tags 'fts5 mcpserver' -o cogos-mcp ./cmd/cogos

  # Cross-compile the entire module for Windows. The build job above only
  # builds ./cmd/cogos (the daemon), which already cross-compiled cleanly —
  # but the repo-root package main (cog node init, BEP, local runner) carried
  # unguarded Unix-only syscalls and broke GOOS=windows undetected (#328).
  # This guards the whole module against platform regressions.
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cross-compile for Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -tags fts5 ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # ripgrep is needed by cog_grep_files. Previously this step ran
      # `apt-get update && install -y ripgrep`; the update wedged on mirror
      # refresh during release run 25808237369 (hung 50+ min before being
      # cancelled). Drop the update — the ubuntu-latest image ships with
      # recent enough apt indexes that install works from cache. A 2-minute
      # timeout guards against unexpected future hangs.
      - name: Install ripgrep
        run: timeout 120 sudo apt-get install -y ripgrep

      - name: Unit tests
        run: go test -tags fts5 -race -count=1 ./...

      # Root `./...` only expands the root module's own packages (verified:
      # `go list ./...` from repo root returns 35 packages, none under
      # pkg/substrate or the other go.work submodules) — workspace mode
      # affects dependency resolution, not what `./...` matches from a given
      # directory. So every submodule listed in go.work has its test suite
      # sitting dead in CI unless walked explicitly. Read the module list
      # from go.work itself (not hardcoded) so this doesn't drift when
      # submodules are added/removed.
      - name: Unit tests (workspace submodules)
        run: |
          set -euo pipefail
          mods=$(go work edit -json | jq -r '.Use[].DiskPath | select(. != ".")')
          failed=0
          for mod in $mods; do
            echo "::group::go test $mod/..."
            if ! (cd "$mod" && go build -tags fts5 ./... && go vet -tags fts5 ./... && go test -tags fts5 -race -count=1 ./...); then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11

      # Workflow shell parse gate (ledger L24). A workflow can be valid YAML
      # and still embed shell that cannot parse: this PR's own first push
      # left an orphaned `fi` in pr-review.yml, YAML validation passed, and
      # three required checks failed in CI with "syntax error near unexpected
      # token `fi'". `bash -n` over every run: block catches that class before
      # it reaches a runner.
      - name: Workflow shell blocks parse
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/ci/check-workflow-shell.py

      # Shell-hardening gate (ledger L15): every tracked scripts/*.sh file
      # must declare `set -euo pipefail` (or `set -eu` for POSIX sh, which
      # has no pipefail) or carry a documented `# no-pipefail: <reason>`
      # opt-out — plus a shellcheck error-severity pass (0 pre-existing
      # findings at error severity, so any hit is a real regression).
      # ubuntu-latest ships shellcheck preinstalled.
      - name: Shell hardening gate
        run: ./scripts/check-shell-hardening.sh scripts

      # Install-guard coverage tripwire: fails if a new site writing the
      # cogos binary into an install path appears without referencing the
      # shared running-daemon guard (scripts/lib/refuse-if-running.sh /
      # .ps1). Grep-based heuristic, not a proof -- see the script's own
      # header for its honest limits. Added alongside the guard's
      # extraction into one shared implementation; see
      # cog://mem/working/2026-07-30-self-review-spike/RETRO-486.md.
      - name: Install guard coverage gate
        run: ./scripts/check-install-guard-coverage.sh

      # Functional regression suite for the guard's actual detection logic.
      # The two gates above are static: neither ever EXECUTES
      # refuse_if_running, so a fail-open regression inside it (reverting the
      # pgrep-exit-status capture, the symlink canonicalization, the
      # unreadable-cmdline refusal) would sail through a fully green CI and
      # ship to every caller that sources this one shared file. This step is
      # what makes those scenarios load-bearing rather than decorative.
      # Needs the Go toolchain (already set up above) to build the stand-in
      # binary the suite execs; it SKIPs cleanly if go is unavailable.
      - name: Install guard regression suite
        run: ./scripts/test-refuse-if-running.sh

      # Same reasoning as the step above, for the pre-push hook added in #612.
      # The static gates confirm .githooks/pre-push EXISTS and passes shell
      # hardening; neither executes its refusal path. A change to the hook —
      # renaming the "pre-push: REFUSED" line, swapping which script enforces
      # hardening — would leave a guard that installs cleanly, runs on every
      # push, and refuses nothing, with CI fully green. This step makes the
      # refusal load-bearing.
      #
      # `make hooks` first: the control exits 2 rather than reporting a
      # meaningless pass when core.hooksPath is unset, which is exactly the
      # state a fresh CI checkout is in. It pushes only to a throwaway bare
      # repo in a temp dir, never to origin.
      - name: Pre-push hook negative control
        run: |
          make hooks
          sh scripts/test-prepush-hook.sh

      # Public release gate. `.cogpublic` has declared these content guards
      # since 2026-04-14, and its header says `cog plan upstream` enforces
      # them — but that command has never existed (`git log -S "plan upstream"`
      # returns only the commit that wrote the claim; the shipped binary
      # answers `unknown command "plan"`; no repo has an active git hook).
      # Three instances of the exact declared patterns reached public repos
      # AFTER the file was written: mod3 #138/#142, cogos #588, mod3 #146.
      # A declared-but-unexecuted guard is worse than none — it reads like
      # coverage during review, so nobody looks twice. These two steps are
      # the missing executor.
      - name: Public release gate — self-test
        run: python3 ./scripts/cogpublic-guard.py --self-test

      - name: Public release gate — scan
        run: python3 ./scripts/cogpublic-guard.py

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        run: go build -tags fts5 -o cogos ./cmd/cogos

      - name: Run E2E tests
        run: COGOS_BIN=./cogos ./scripts/e2e-test.sh

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG updated
        run: |
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q CHANGELOG.md; then
            echo "::warning file=CHANGELOG.md::CHANGELOG.md was not updated in this PR. Please add a changelog entry describing your changes."
          fi
