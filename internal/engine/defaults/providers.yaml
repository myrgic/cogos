# Inference provider configuration
# The router loads enabled providers at startup and routes requests
# based on capability, availability, and the sovereignty gradient.
#
# ── claude-oauth: discovery, not declaration ─────────────────────────────────
# You will NOT find a "claude-oauth" entry below. Every node that already has
# Claude Code credentials (macOS keychain, CLAUDE_CODE_OAUTH_TOKEN env var, or
# ~/.claude/.credentials.json / %USERPROFILE%\.claude\.credentials.json) gets a
# working claude-oauth provider automatically — no entry here, no token paste.
# The kernel re-checks for a newly-created credential on its normal
# availability-reconcile timer, so logging into Claude Code for the first time
# on this machine (`claude /login`) is picked up without a kernel restart.
# To opt out, add:
#   claude_oauth:
#     auto: false
# An explicit "claude-oauth:" entry under `providers:` (any config, any model)
# always overrides auto-registration — declaration wins over discovery.
#
# Additional provider types are first-class but disabled by default:
#   - lmstudio       : OpenAI-compatible local server (LM Studio). Point
#                      `endpoint` at your LM Studio REST address (the app
#                      defaults to http://127.0.0.1:1234) and `model` at
#                      whatever you have loaded there.
#   - vllm           : OpenAI-compatible local server (Linux/CUDA). See
#                      docs/inference/vllm.md for setup. The kernel
#                      assumes the operator runs `vllm serve` themselves;
#                      a future "vllm-supervised" type will add launchd /
#                      systemd lifecycle management.
#   - mlx-supervised : kernel-managed mlx_lm.server (Apple Silicon).
# Add them to providers.local.yaml to opt in. Examples:
#   lmstudio-local:
#     type: lmstudio
#     enabled: true
#     endpoint: "http://127.0.0.1:1234"
#     model: "your-loaded-model-id"
#     timeout: 300
#     context_window: 8192
#
#   vllm-local:
#     type: vllm
#     enabled: true
#     endpoint: "http://localhost:8000"
#     model: "google/gemma-2-9b-it"
#     timeout: 300
#     context_window: 32768
#
# ── OPT-IN: lms-model-state reconciler (ADR-104) ─────────────────────────────
# An LM Studio dispatch backend can additionally opt into declarative
# model/context-state reconciliation: the kernel keeps the declared model loaded
# at the declared context length via the Node @lmstudio/sdk actuator
# (scripts/lms-actuator/). This is OFF BY DEFAULT — it activates only when a
# backend declares `options.model_state.manage: true`. See
# docs/inference/lms-model-state.md.
#
# The block below is COMMENTED OUT deliberately, and its values are
# placeholders for an example remote LM Studio backend on another machine on
# your network -- fill in your own host, model, and context length. Verify
# the context length live against that backend before trusting it (LM Studio
# will silently accept a context_length larger than a model actually
# supports). Uncomment ONLY after `cd scripts/lms-actuator && npm install`
# and operator live-verification of the actuator against the target backend.
#
#   remote-node:
#     type: openai              # OpenAI-compatible dispatch (LM Studio REST)
#     enabled: true
#     endpoint: "http://REMOTE_HOST:1234"
#     api_key_env: REMOTE_NODE_API_KEY   # Bearer token; also used by the reconciler
#     model: "your-model-id"
#     timeout: 300
#     context_window: 8192
#     options:
#       model_state:
#         manage: true          # <-- the opt-in switch; false/absent ⇒ Suspended
#         model: "your-model-id"
#         context_length: 8192  # verify against what your backend actually serves
#         parallel: 1
#         keep_warm: true
#         jit_evict: false       # true ⇒ unload a non-target model that crowds the card

providers:
  anthropic:
    type: anthropic
    enabled: false   # Set ANTHROPIC_API_KEY and enable to use
    api_key_env: ANTHROPIC_API_KEY
    model: "claude-sonnet-5"
    timeout: 120
    context_window: 200000

routing:
  prefer_local: true
  fallback_chain:
    - anthropic
